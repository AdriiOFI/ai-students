<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIStudents - Planificador d'Estudi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col md:flex-row">

    <!-- 📁 MENÚ LATERAL: Planificacions Fetes -->
    <aside class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col p-6 h-auto md:h-screen">
        <div class="flex items-center gap-3 mb-8">
            <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold text-lg">AI</div>
            <div>
                <span class="text-xl font-semibold tracking-tight text-slate-900 block">AIStudents</span>
                <span class="text-xs text-slate-400">Laboratori d'Auditoria</span>
            </div>
        </div>
        
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Planificacions Fetes</h2>
        
        <!-- Llista de planificacions emmagatzemades -->
        <div id="history-list" class="space-y-2 flex-1 overflow-y-auto mb-4">
            <!-- S'omplirà dinàmicament amb JavaScript -->
            <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl text-xs text-slate-400 text-center">
                Encara no hi ha planificacions desades.
            </div>
        </div>
        
        <div class="pt-4 border-t border-slate-100 text-xs text-slate-400 text-center">
            AIStudents v1.0 — MVP SMX
        </div>
    </aside>

    <!-- 🖥️ CONTINGUT PRINCIPAL: Interfície d'Estudi -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Nou Pla d'Estudi Intelligent</h1>
            <p class="text-sm text-slate-500 mt-1">Organitza el teu temari i aprèn amb criteri sense caure en el copy-paste.</p>
        </header>

        <div class="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm max-w-3xl">
            <form id="study-form" class="space-y-6">
                
                <!-- Títol del temari / assignatura -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Títol del Temari o Assignatura</label>
                    <input type="text" id="subject-title" required placeholder="Ex: Xarxes locals - M03 (SMX)" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>

                <!-- Data d'examen i Comptador de dies -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Data de l'Examen</label>
                        <input type="date" id="exam-date" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                    <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 flex flex-col justify-center items-center text-center">
                        <span class="text-xs text-slate-400 uppercase font-semibold">Dies disponibles</span>
                        <span id="days-counter" class="text-2xl font-bold text-indigo-600 mt-0.5">--</span>
                    </div>
                </div>

                <!-- Temari / PDFs -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Temari (PDFs, apunts...)</label>
                    <div class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-indigo-400 transition cursor-pointer">
                        <input type="file" id="syllabus-files" multiple accept=".pdf,.txt" class="hidden">
                        <label for="syllabus-files" class="cursor-pointer">
                            <p class="text-sm text-slate-600 font-medium">Arrossega els fitxers aquí o <span class="text-indigo-600 underline">examina</span></p>
                            <p class="text-xs text-slate-400 mt-1">PDFs, apunts de classe o fitxers de text</p>
                        </label>
                    </div>
                </div>

                <!-- Capçalera per comentaris extra -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Capçalera per comentaris extra</label>
                    <textarea id="extra-comments" rows="3" placeholder="Ex: Vull prioritzar la pràctica de permisos a Linux i subxarxes, tinc dubtes amb això..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></textarea>
                </div>

                <!-- Botó d'acció -->
                <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-xl hover:bg-indigo-700 transition shadow-sm text-sm">
                    Generar Planificació amb IA 🚀
                </button>

            </form>
        </div>
    </main>

    <!-- JavaScript per gestionar la lògica -->
    <script>
        const examDateInput = document.getElementById('exam-date');
        const daysCounter = document.getElementById('days-counter');
        const studyForm = document.getElementById('study-form');
        const historyList = document.getElementById('history-list');

        // Carregar planificacions guardades al localStorage en iniciar
        let plans = JSON.parse(localStorage.getItem('ai_students_plans')) || [];
        renderHistory();

        // Calcular dies restants en temps real
        examDateInput.addEventListener('change', () => {
            const selectedDate = new Date(examDateInput.value);
            const today = new Date();
            const diffTime = selectedDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays >= 0) {
                daysCounter.textContent = `${diffDays} dies`;
            } else {
                daysCounter.textContent = `Data passada`;
            }
        });

        // Guardar nova planificació al enviar el formulari
        studyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const title = document.getElementById('subject-title').value;
            const date = examDateInput.value;
            const comments = document.getElementById('extra-comments').value;

            // Calcular dies per guardar-ho
            const selectedDate = new Date(date);
            const today = new Date();
            const diffDays = Math.ceil((selectedDate - today) / (1000 * 60 * 60 * 24));

            const newPlan = {
                id: Date.now(),
                title,
                date,
                days: diffDays >= 0 ? diffDays : 0,
                comments
            };

            plans.unshift(newPlan); // Afegir al principi
            localStorage.setItem('ai_students_plans', JSON.stringify(plans));
            
            renderHistory();
            studyForm.reset();
            daysCounter.textContent = '--';
            alert('Planificació generada i desada correctament!');
        });

        // Funció per pintar el menú lateral amb l'historial
        function renderHistory() {
            if (plans.length === 0) {
                historyList.innerHTML = `
                    <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl text-xs text-slate-400 text-center">
                        Encara no hi ha planificacions desades.
                    </div>
                `;
                return;
            }

            historyList.innerHTML = '';
            plans.forEach(plan => {
                const item = document.createElement('div');
                item.className = "p-3 bg-indigo-50/50 border border-indigo-100/60 rounded-xl cursor-pointer transition hover:bg-indigo-100/80";
                item.innerHTML = `
                    <p class="text-sm font-medium text-indigo-900">${plan.title}</p>
                    <p class="text-xs text-indigo-600 mt-1">Examen en ${plan.days} dies</p>
                `;
                historyList.appendChild(item);
            });
        }
    </script>
</body>
</html>
